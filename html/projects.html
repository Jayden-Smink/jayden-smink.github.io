<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Projecten</title>

<body>
    <header class="site-header">
        <nav class="main-nav" aria-label="Hoofdnavigatie">
            <ul>

                <li><a class="nav-item" href="blog.html">Blog</a></li>

    <main>
        <section class="project-intro">
            <p class="intro-text">Mijn werk</p>
            <h1>Projecten</h1>
        </section>
        <section class="project-filters" aria-label="Projecten filteren">
            <button class="filter-button active-filter" data-filter="Alle">Alle</button>
            <button class="filter-button" data-filter="HTML">HTML</button>
            <button class="filter-button" data-filter="CSS">CSS</button>
            <button class="filter-button" data-filter="JavaScript">JavaScript</button>
            <button class="filter-button" data-filter="SQL">SQL</button>
        </section>
        <section class="projects" aria-label="Mijn projecten">
            <template id="project-template">
                <article class="project-card">
                    <img class="project-image" src="" alt="">

                    <div class="project-content">
                        <h2 class="project-title"></h2>
                        <p class="project-description"></p>

                        <ul class="project-technologies"></ul>

                        <a class="project-link" href="">
